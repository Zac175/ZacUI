# Releases ZacUI whenever the version in Zacui/Zacui.toc changes.
#
# Push a commit that bumps "## Version:" and this workflow:
#   1. tags the commit with that version (e.g. 3.0.1),
#   2. starts itself again on that tag, and that run
#   3. takes the version's notes from Zacui/UI/Changelog/Changelog_Data.lua,
#   4. builds the zip and publishes it as a GitHub release and to CurseForge
#      (CF_API_KEY in the repo's secrets; the project id is in the TOC).
# Pushes that don't change the version do nothing.
#
# Why two steps: the packager only builds when the run itself is on a tag.
# A tag pushed from inside a run never starts a new run on its own, so the
# first run starts the second one by hand ("Found future tag ..., not
# packaging" was the packager skipping a run that was on the branch).
name: Release

on:
  push:
    branches: [main, master]
    paths: ["Zacui/Zacui.toc"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: ver
        run: |
          v=$(grep -m1 -E '^## Version:' Zacui/Zacui.toc | sed -E 's/^## Version:[[:space:]]*//; s/[[:space:]\r]+$//')
          if [ -z "$v" ]; then echo "No version in Zacui/Zacui.toc"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The version before this push (none on the very first push).
          before="${{ github.event.before }}"
          old=""
          if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null; then
            old=$(git show "$before:Zacui/Zacui.toc" 2>/dev/null | grep -m1 -E '^## Version:' | sed -E 's/^## Version:[[:space:]]*//; s/[[:space:]\r]+$//')
          fi
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Version $v is already tagged - nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [ -z "$old" ] || [ "$old" = "$v" ]; }; then
            echo "The version didn't change in this push ($v) - nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $v (was ${old:-none})."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag this version
        if: steps.ver.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.version }}" -m "ZacUI ${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"

      - name: Build on the new tag
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref "${{ steps.ver.outputs.version }}"

  package:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the release notes
        run: |
          sudo apt-get install -y -qq lua5.1 >/dev/null
          lua5.1 .github/tools/changelog_md.lua "${{ github.ref_name }}" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Build and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
